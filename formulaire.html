<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Confirmation de réception — Edeluxe Livraison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #15130E;
    --ink-2: #1D1A13;
    --cream: #F4EEE1;
    --stone: #9C9686;
    --blue: #5B84D9;
  }

  html, body { height: 100%; background: var(--ink); }

  body {
    font-family: 'Manrope', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
  }

  .screen { width: 100%; max-width: 360px; padding: 24px 8px 8px; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 26px;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.05s forwards;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 0.5px solid rgba(244,238,225,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    text-decoration: none;
  }

  .icon-btn svg { width: 16px; height: 16px; stroke: var(--cream); }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--stone);
  }

  .summary {
    background: var(--ink-2);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.05s forwards;
  }

  .summary .label { font-size: 13px; color: var(--stone); margin-bottom: 4px; }
  .summary .value { font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: var(--cream); }
  .summary .amount { color: var(--blue); }
  .summary .right { text-align: right; }

  .hint {
    font-size: 13px;
    color: var(--stone);
    margin-bottom: 12px;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.25s forwards;
  }

  .checklist {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 26px;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.25s forwards;
  }

  .check-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--ink-2);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    border: none;
    width: 100%;
    text-align: left;
    font-family: 'Manrope', sans-serif;
  }

  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1px solid rgba(244,238,225,0.3);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }

  .check-box svg { width: 14px; height: 14px; stroke: var(--ink); display: none; }

  .check-row.checked .check-box { background: var(--blue); border-color: var(--blue); }
  .check-row.checked .check-box svg { display: block; }

  .check-label { font-size: 14px; color: var(--cream); }

  .continue-btn {
    width: 100%;
    height: 50px;
    background: transparent;
    border: 1px solid rgba(244,238,225,0.25);
    border-radius: 10px;
    color: var(--stone);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.45s forwards;
  }

  .continue-btn.ready { border-color: var(--blue); color: var(--cream); }
  .continue-btn svg { width: 16px; height: 16px; }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .topbar, .summary, .hint, .checklist, .continue-btn { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="screen">

  <div class="topbar">
    <a href="scan.html" class="icon-btn" aria-label="Retour au scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <span class="eyebrow">confirmation de réception</span>
  </div>

  <div class="summary">
    <div>
      <div class="label">Bordereau</div>
      <div class="value">EDX-04521</div>
    </div>
    <div class="right">
      <div class="label">Montant</div>
      <div class="value amount">12 500 F</div>
    </div>
  </div>

  <p class="hint">Cochez pour confirmer, sans rien écrire.</p>

  <div class="checklist" id="checklist">
    <button type="button" class="check-row checked" onclick="toggleCheck(this)">
      <span class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
      <span class="check-label">Colis reçu au complet</span>
    </button>
    <button type="button" class="check-row" onclick="toggleCheck(this)">
      <span class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
      <span class="check-label">Emballage en bon état</span>
    </button>
    <button type="button" class="check-row" onclick="toggleCheck(this)">
      <span class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
      <span class="check-label">Commande confirmée</span>
    </button>
  </div>

  <a href="signature.html" class="continue-btn" id="continueBtn">
    Continuer vers la signature
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </a>

</div>

<script>
  function toggleCheck(row) {
    row.classList.toggle('checked');
    var rows = document.querySelectorAll('#checklist .check-row');
    var all = Array.from(rows).every(function (r) { return r.classList.contains('checked'); });
    var btn = document.getElementById('continueBtn');
    btn.classList.toggle('ready', all);
  }
</script>

</body>
</html>
