<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Créer un bordereau — Edeluxe Livraison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #15130E; --ink-2: #1D1A13; --cream: #F4EEE1; --stone: #9C9686; --blue: #5B84D9;
  }
  html, body { min-height: 100%; background: var(--ink); }
  body { font-family: 'Manrope', sans-serif; display: flex; justify-content: center; padding: 32px 24px 60px; }
  .wrap { width: 100%; max-width: 400px; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: var(--stone); margin-bottom: 6px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; color: var(--cream); margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: var(--stone); margin-bottom: 6px; margin-top: 18px; }
  input {
    width: 100%; height: 46px; background: var(--ink-2); border: 1px solid rgba(244,238,225,0.15);
    border-radius: 10px; padding: 0 14px; color: var(--cream); font-family: 'Manrope', sans-serif; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--blue); }
  input::placeholder { color: rgba(156,150,134,0.6); }
  button {
    margin-top: 28px; width: 100%; height: 50px; background: transparent; border: 1px solid var(--blue);
    border-radius: 10px; color: var(--cream); font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button:hover { background: rgba(91,132,217,0.1); }
  #result { margin-top: 26px; display: none; }
  #result .box { background: var(--ink-2); border-radius: 12px; padding: 16px; }
  #result .box p { font-size: 12px; color: var(--stone); margin-bottom: 8px; }
  #linkOut {
    width: 100%; background: var(--ink); border: 1px solid rgba(244,238,225,0.15); border-radius: 8px;
    padding: 10px 12px; color: var(--blue); font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    word-break: break-all; margin-bottom: 10px; white-space: normal;
  }
  #copyBtn {
    margin-top: 0; height: 42px; border-color: rgba(244,238,225,0.25); color: var(--cream); font-size: 13px;
  }
  #copyBtn.copied { border-color: var(--blue); }
  .note { font-size: 12px; color: var(--stone); margin-top: 10px; line-height: 1.6; }

  .photo-btn {
    margin-top: 6px; width: 100%; height: 46px; background: var(--ink-2);
    border: 1px dashed rgba(244,238,225,0.25); border-radius: 10px;
    color: var(--cream); font-family: 'Manrope', sans-serif; font-size: 13px;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  .photo-btn:hover { border-color: var(--blue); }
  #photoPreviewWrap { margin-top: 10px; display: none; position: relative; }
  #photoPreviewWrap img {
    width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px;
    border: 1px solid rgba(244,238,225,0.15);
  }
  #photoRetake {
    margin-top: 8px; height: 38px; font-size: 12.5px;
    border-color: rgba(244,238,225,0.25); color: var(--stone);
  }
  #photoStatus { font-size: 11.5px; color: var(--stone); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">outil interne</div>
  <h1>Créer un bordereau</h1>

  <label for="client">Nom du client</label>
  <input id="client" type="text" placeholder="Ex : Aïcha Koné">

  <label for="bordereau">Numéro de bordereau</label>
  <input id="bordereau" type="text" placeholder="Ex : EDX-04521">

  <label for="montant">Montant (FCFA)</label>
  <input id="montant" type="number" placeholder="Ex : 12500">

  <label for="wave">Lien de paiement Wave (généré automatiquement — modifiable si besoin)</label>
  <input id="wave" type="url" placeholder="https://pay.wave.com/...">

  <label for="photo">Photo du produit (optionnel)</label>
  <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
  <div class="photo-btn" onclick="document.getElementById('photoInput').click()">📷 Prendre ou choisir une photo</div>
  <div id="photoPreviewWrap">
    <img id="photoPreviewImg" alt="Aperçu de la photo">
    <button type="button" id="photoRetake" onclick="document.getElementById('photoInput').click()">🔄 Reprendre une photo</button>
    <div id="photoStatus"></div>
  </div>
  <button onclick="generate()">Générer le lien du bordereau</button>

  <div id="result">
    <div class="box">
      <p>Lien à copier et envoyer sur WhatsApp :</p>
      <div id="linkOut"></div>
      <button id="copyBtn" onclick="copyLink()">Copier le lien</button>
    </div>
    <p class="note">Envoyez ce lien au client sur WhatsApp — la photo (si ajoutée) s'affichera directement dans son bordereau dès qu'elle ouvre le lien, aucun envoi séparé nécessaire.</p>
  </div>
</div>

<script>
  // Identifiant fixe de votre compte marchand Wave Business EDELUXE
  var WAVE_MERCHANT_ID = 'M_ci_4Y2x8n5zuKdc';

  // Remplit automatiquement le lien Wave dès que le montant est saisi,
  // sauf si vous avez déjà collé un lien manuellement
  document.getElementById('montant').addEventListener('input', function () {
    var montant = this.value.trim();
    var waveField = document.getElementById('wave');
    if (montant) {
      waveField.value = 'https://pay.wave.com/m/' + WAVE_MERCHANT_ID + '/c/ci/?amount=' + montant;
    } else {
      waveField.value = '';
    }
  });

  var IMGBB_API_KEY = 'cf407009af4d1272b842e7ab06e1b709';
  var generatedLink = '';
  var photoUrl = '';       // lien court renvoyé par ImgBB, utilisé dans le lien final
  var photoUploading = false;

  document.getElementById('photoInput').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var statusEl = document.getElementById('photoStatus');
    photoUrl = '';
    photoUploading = true;
    statusEl.textContent = 'Préparation de la photo...';

    var reader = new FileReader();
    reader.onload = function (evt) {
      var img = new Image();
      img.onload = function () {
        // Compression légère : juste pour un envoi rapide, la taille du lien final n'est plus un problème
        var maxWidth = Math.min(1000, img.width);
        var scale = Math.min(1, maxWidth / img.width);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.75);

        document.getElementById('photoPreviewImg').src = dataUrl;
        document.getElementById('photoPreviewWrap').style.display = 'block';
        statusEl.textContent = '📤 Envoi de la photo en cours...';

        var base64Only = dataUrl.split(',')[1];
        var formData = new FormData();
        formData.append('key', IMGBB_API_KEY);
        formData.append('image', base64Only);

        fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData })
          .then(function (res) { return res.json(); })
          .then(function (json) {
            photoUploading = false;
            if (json && json.success && json.data && json.data.url) {
              photoUrl = json.data.url;
              statusEl.innerHTML = '✓ Photo envoyée et prête (lien court et fiable)';
            } else {
              statusEl.innerHTML = '⚠️ Échec de l\'envoi de la photo. Réessayez ou changez de photo.';
            }
          })
          .catch(function () {
            photoUploading = false;
            statusEl.innerHTML = '⚠️ Pas de connexion internet — la photo n\'a pas pu être envoyée. Réessayez.';
          });
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  function generate() {
    var client = document.getElementById('client').value.trim();
    var bordereau = document.getElementById('bordereau').value.trim();
    var montant = document.getElementById('montant').value.trim();
    var wave = document.getElementById('wave').value.trim();

    if (!bordereau || !montant) {
      alert('Merci de renseigner au minimum le numéro de bordereau et le montant.');
      return;
    }
    if (photoUploading) {
      alert('La photo est encore en cours d\'envoi, patientez quelques secondes puis réessayez.');
      return;
    }

    var base = window.location.href.replace('creer-bordereau.html', 'commande.html');
    var params = new URLSearchParams();
    if (client) params.set('client', client);
    params.set('bordereau', bordereau);
    params.set('montant', montant);
    if (wave) params.set('wave', wave);
    if (photoUrl) params.set('photo', photoUrl);

    generatedLink = base + '?' + params.toString();
    document.getElementById('linkOut').textContent = generatedLink;
    document.getElementById('result').style.display = 'block';

    var lenNote = document.getElementById('linkLenNote');
    if (!lenNote) {
      lenNote = document.createElement('p');
      lenNote.id = 'linkLenNote';
      lenNote.className = 'note';
      document.getElementById('linkOut').insertAdjacentElement('afterend', lenNote);
    }
    lenNote.textContent = generatedLink.length > 25000
      ? '⚠️ Lien assez long (' + generatedLink.length + ' caractères) — utilisez bien le bouton "Copier le lien" ci-dessous plutôt qu\'une sélection manuelle.'
      : '✓ Lien de taille normale (' + generatedLink.length + ' caractères).';
  }

  function copyLink() {
    if (!generatedLink) return;
    navigator.clipboard.writeText(generatedLink).then(function () {
      var btn = document.getElementById('copyBtn');
      btn.textContent = 'Lien copié ✓';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = 'Copier le lien'; btn.classList.remove('copied'); }, 2000);
    });
  }
</script>
</body>
</html>
