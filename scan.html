<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scanner un bordereau — Edeluxe Livraison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #15130E;
    --ink-2: #0C0B08;
    --cream: #F4EEE1;
    --stone: #9C9686;
    --blue: #5B84D9;
  }

  html, body { height: 100%; background: var(--ink); }

  body {
    font-family: 'Manrope', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
  }

  .screen {
    width: 100%;
    max-width: 360px;
    padding: 24px 8px 8px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 34px;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.05s forwards;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 0.5px solid rgba(244,238,225,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    cursor: pointer;
    text-decoration: none;
  }

  .icon-btn svg { width: 16px; height: 16px; stroke: var(--cream); }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--stone);
  }

  .viewfinder {
    width: 232px;
    height: 232px;
    margin: 0 auto 28px;
    background: var(--ink-2);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.3s forwards;
    background-image:
      linear-gradient(rgba(244,238,225,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244,238,225,0.035) 1px, transparent 1px);
    background-size: 23px 23px;
  }

  .sweep {
    position: absolute;
    left: 14px;
    right: 14px;
    top: 14px;
    height: 2px;
    background: var(--blue);
  }

  @media (prefers-reduced-motion: no-preference) {
    .sweep { animation: scanSweep 2.2s ease-in-out infinite alternate; }
  }

  .corners { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  .instruction {
    text-align: center;
    font-size: 14px;
    color: var(--stone);
    line-height: 1.6;
    margin: 0 0 30px;
    padding: 0 12px;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.5s forwards;
  }

  .manual-link {
    text-align: center;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.7s forwards;
  }

  .manual-link a {
    font-size: 13px;
    color: var(--blue);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes scanSweep {
    0%   { transform: translateY(0); opacity: 0.9; }
    50%  { opacity: 0.4; }
    100% { transform: translateY(202px); opacity: 0.9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .topbar, .viewfinder, .instruction, .manual-link { animation: none; opacity: 1; }
    .sweep { animation: none; }
  }
</style>
</head>
<body>

<div class="screen">

  <div class="topbar">
    <a href="index.html" class="icon-btn" aria-label="Retour à l'accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <span class="eyebrow">scanner un bordereau</span>
    <div class="icon-btn" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
    </div>
  </div>

  <div class="viewfinder">
    <div class="sweep"></div>
    <svg class="corners" viewBox="0 0 232 232" aria-hidden="true">
      <path d="M20 44 V26 Q20 20 26 20 H44" fill="none" stroke="#5B84D9" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M188 20 H206 Q212 20 212 26 V44" fill="none" stroke="#5B84D9" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M212 188 V206 Q212 212 206 212 H188" fill="none" stroke="#5B84D9" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M44 212 H26 Q20 212 20 206 V188" fill="none" stroke="#5B84D9" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <p class="instruction">Cadrez le QR code imprimé sur le bordereau de livraison.</p>

  <div class="manual-link">
    <a href="#">Saisir le code manuellement</a>
  </div>

</div>

</body>
</html>
