<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Livraison confirmée — Edeluxe Livraison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #15130E;
    --ink-2: #1D1A13;
    --cream: #F4EEE1;
    --stone: #9C9686;
    --blue: #5B84D9;
  }

  html, body { height: 100%; background: var(--ink); }

  body {
    font-family: 'Manrope', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
  }

  .screen {
    width: 100%;
    max-width: 360px;
    padding: 44px 8px 8px;
    text-align: center;
  }

  .badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    opacity: 0;
    animation: badgePop 0.55s cubic-bezier(.2,.8,.3,1) 0.1s forwards;
  }

  .badge svg { width: 30px; height: 30px; stroke: var(--ink); }

  .title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--cream);
    margin-bottom: 8px;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.4s forwards;
  }

  .subtitle {
    font-size: 13px;
    color: var(--stone);
    margin-bottom: 26px;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.4s forwards;
  }

  .details {
    background: var(--ink-2);
    border-radius: 14px;
    padding: 16px 18px;
    text-align: left;
    margin-bottom: 16px;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.6s forwards;
  }

  .details .row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 0.5px solid rgba(244,238,225,0.1);
  }

  .details .row:last-child { border-bottom: none; }

  .details .label { font-size: 13px; color: var(--stone); }
  .details .value { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--cream); }
  .details .value.amount { color: var(--blue); }

  .status-row {
    display: flex;
    gap: 8px;
    margin-bottom: 30px;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.6s forwards;
  }

  .status-item {
    flex: 1;
    background: var(--ink-2);
    border-radius: 10px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .status-item svg { width: 16px; height: 16px; stroke: var(--blue); }
  .status-item p { font-size: 10.5px; color: var(--stone); }

  .home-btn {
    width: 100%;
    height: 50px;
    background: transparent;
    border: 1px solid rgba(244,238,225,0.25);
    border-radius: 10px;
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    opacity: 0;
    animation: riseIn 0.5s ease-out 0.8s forwards;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes badgePop {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .badge, .title, .subtitle, .details, .status-row, .home-btn { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="screen">

  <div class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>

  <div class="title">Livraison confirmée</div>
  <div class="subtitle">Paiement reçu et bordereau archivé</div>

  <div class="details">
    <div class="row">
      <span class="label">Bordereau</span>
      <span class="value">EDX-04521</span>
    </div>
    <div class="row">
      <span class="label">Montant reçu</span>
      <span class="value amount">12 500 F</span>
    </div>
    <div class="row">
      <span class="label">Heure</span>
      <span class="value" id="time"></span>
    </div>
  </div>

  <div class="status-row">
    <div class="status-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M17 2l4 4-14 14H3v-4L17 2z"/><path d="M12.5 6.5l5 5"/></svg>
      <p>Envoyé au client</p>
    </div>
    <div class="status-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 002 2h10a2 2 0 002-2V9"/><line x1="10" y1="13" x2="14" y2="13"/></svg>
      <p>Archivé</p>
    </div>
  </div>

  <a href="index.html" class="home-btn">Retour à l'accueil</a>

</div>

<script>
  var now = new Date();
  var h = String(now.getHours()).padStart(2, '0');
  var m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('time').textContent = h + ':' + m;
</script>

</body>
</html>
